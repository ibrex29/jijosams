name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Debug: confirm repo structure
      - name: Debug Directory
        run: |
          pwd
          ls -la

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 4. Cache Yarn dependencies
      - name: Cache Yarn
        uses: actions/cache@v3
        with:
          path: |
            ~/.yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      # 5. Install dependencies (including dayjs)
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # 6. Build Next.js project
      - name: Build
        run: yarn build

      # 7. Deploy to server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/slujst-frontend
            git pull origin main
            yarn install --frozen-lockfile
            yarn build
            # Reload PM2 to ensure zero-downtime deploy on port 3100
            pm2 reload slujst-frontend --update-env -- start -p 3100
